<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="carousel">
      <div class="slides">
        <div class="slide active">
          <img src="./imgs/landscape1.jpg" alt="image 1" />
        </div>
        <div class="slide">
          <img src="./imgs/landscape2.jpg" alt="image 2" />
        </div>
        <div class="slide">
          <img src="./imgs/landscape3.jpg" alt="image 3" />
        </div>
        <div class="slide">
          <img src="./imgs/landscape4.jpg" alt="image 4" />
        </div>
      </div>

      <button class="prev">⏮️</button>
      <button class="next">⏭️</button>

    </div>
    <div class="dots">
      <span class="dot active" data-slide="0"></span>
      <span class="dot" data-slide="1"></span>
      <span class="dot" data-slide="2"></span>
      <span class="dot" data-slide="3"></span>
    </div>
  </body>
</html>
