<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>JSON: Task 1</title>
    <style>
      p {
        color: purple;
        margin: 0.5em 0;
      }

      * {
        box-sizing: border-box;
      }
    </style>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <section class="preview"></section>
  </body>
  <script>
    const section = document.querySelector("section");

    let para1 = document.createElement("p");
    let para2 = document.createElement("p");
    let motherInfo = "The mother cats are called ";
    let kittenInfo;
    const requestURL =
      "https://mdn.github.io/learning-area/javascript/oojs/tasks/json/sample.json";

    fetch(requestURL)
      .then((response) => response.text())
      .then((text) => displayCatInfo(text));

    function displayCatInfo(catString) {
      let total = 0;

      // Add your code here

      const catStringJson = JSON.parse(catString);
      const catNames = catStringJson.map((cat) => cat.name);
      motherInfo += `${catNames.slice(0, -1).join(", ")} and ${
        catNames[catNames.length - 1]
      }.`;

      kittens = catStringJson.flatMap((cat) => cat.kittens);
      total = kittens.length;

      const { male, female } = kittens.reduce(
        (acc, kitten) => {
          kitten.gender == "m" ? acc.male++ : acc.female++;
          return acc;
        },
        { male: 0, female: 0 }
      );


      console.log(`total ${total}`);

      kittenInfo = `total: ${total} female: ${female} male: ${male}`;
      // Don't edit the code below here!

      para1.textContent = motherInfo;
      para2.textContent = kittenInfo;
    }

    section.appendChild(para1);
    section.appendChild(para2);
  </script>
</html>
